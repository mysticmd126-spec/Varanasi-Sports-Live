async function img(id){const f=document.getElementById(id)?.files?.[0];if(!f)return null;return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const max=1000,sc=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/webp',.65))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(f)})}
function setv(id,v){const x=document.getElementById(id);if(x)x.value=v??''}function clearEdit(t){editing[t]=null;renderAdmin()}
function edit(t,i){editing[t]=i;renderAdmin();tab(t==='event'?'events':t==='service'?'services':t==='rate'?'rates':t==='gallery'?'gallery':'employees');const x=t==='event'?data.events[i]:t==='service'?data.services[i]:t==='rate'?data.packages[i]:t==='gallery'?data.gallery[i]:data.employees[i];if(t==='event'){setv('e1',x.title);setv('e2',x.date);setv('e3',x.venue);setv('e4',x.link)}if(t==='service'){setv('s1',x.name);setv('s2',x.icon);setv('s3',x.description);setv('s4',x.features)}if(t==='rate'){setv('r1',x.name);setv('r2',x.price);setv('r3',x.includes)}if(t==='gallery'){setv('g2',x.caption)}if(t==='employee'){setv('m1',x.name);setv('m2',x.phone);setv('m3',x.aadhar);setv('m4',x.designation);setv('m5',x.experience);setv('m7',x.address)}}
async function del(t,i){if(!confirm('Delete this item?'))return;const map={event:'events',service:'services',rate:'packages',gallery:'gallery',employee:'employees'};data[map[t]].splice(i,1);await saveData()}

pp</a><a class="contactAction" href="mailto:${esc(s.email||'')}" ${s.email?'':'onclick="return false;"'}><span style="font-size:18px">✉</span>Email</a></div><p style="margin-top:18px">${esc(c.coverage)}</p><div class="trust" style="margin-top:18px">${lines(c.sports).map(t=>`<span>${esc(t)}</span>`).join('')}</div></div><div class="card"><form id="quoteForm"><div class="row"><div><label>Name<input id="qName" required placeholder="Your name"></label></div><div><label>Phone / WhatsApp<input id="qPhone" required inputmode="tel" autocomplete="tel" maxlength="14" pattern="(?:\+91[- ]?|0)?[6-9]\d{9}" placeholder="+91 9876543210"></label></div></div><div class="row"><div><label>Sport / Event<input id="qEvent" placeholder="Cricket tournament"></label></div><div><label>Event Date<input id="qDate" type="date"></label></div></div><div><label>Venue / City<input id="qVenue" placeholder="Venue, city"></label></div><div><label>What do you need?<textarea id="qNeed" placeholder="4-camera live stream, scoreboard, commentary, highlights..."></textarea></label></div><div class="actions"><button class="btn btnPrimary" type="submit">Send WhatsApp</button><button class="btn btnGhost" type="button" onclick="sendEmail()">Send Email</button></div><div class="hint">Valid Indian mobile number is required (10 digits; +91/0 also accepted).</div></form></div></div></div></section>`;document.getElementById('appFooter').innerHTML=`<div class="container footerGrid"><div>© <span id="year"></span> ${esc(data.footer.copyright)}</div><div class="footerLinks"><a href="#home">Home</a><a href="#services">Services</a><a href="#packages">Rates</a><a href="#employees">Team</a><a href="#contact">Book</a><a href="${YT}" target="_blank" rel="noopener noreferrer">YouTube</a><a href="https://www.facebook.com/share/18PCZY6K6Q/" target="_blank" rel="noopener noreferrer">Facebook</a><a href="https://www.instagram.com/varanasi_sports_live?igsi=eHdnMmsweGhsenYy" target="_blank" rel="noopener noreferrer">Instagram</a></div></div>`;document.getElementById('year').textContent=new Date().getFullYear();const ev=document.getElementById('eventList');ev.innerHTML=data.events.length?data.events.map(e=>`<div class="event"><div class="eventThumb">${e.image?`<img src="${esc(e.image)}" style="width:100%;height:100%;object-fit:cover;border-radius:13px">`:'🏟️'}</div><div><div class="status">Event Link</div><h3>${esc(e.title)}</h3><p>${esc(e.date)} • ${esc(e.venue)}</p></div><a class="btn btnGhost" href="${esc(e.link||'#')}" target="_blank" rel="noopener noreferrer">Open Event →</a></div>`).join(''):'<div class="hint">No events added yet.</div>';document.getElementById('serviceList').innerHTML=data.services.map(x=>`<div class="card"><div class="icon">${esc(x.icon)}</div><h3>${esc(x.name)}</h3><p>${esc(x.description)}</p><ul class="featureList">${lines(x.features).map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>`).join('');document.getElementById('packageList').innerHTML=data.packages.map((p,i)=>`<div class="card package ${i===2?'popular':''}">${i===2?'<span class="popularLabel">POPULAR</span>':''}<h3>${esc(p.name)}</h3><div class="price">${esc(p.price)} <small>starting</small></div><ul class="featureList"><li>${esc(p.includes)}</li><li>Final quote depends on event scope</li></ul><a class="btn btnGhost" style="margin-top:15px;width:100%" href="#contact">Request Quote</a></div>`).join('');document.getElementById('employeeGrid').innerHTML=(data.employees||[]).length?data.employees.map(e=>`<div class="card" style="text-align:center"><img src="${esc(e.image||s.logo)}" style="width:130px;height:130px;object-fit:cover;border-radius:50%;margin:0 auto 15px;border:2px solid #2d3949"><h3>${esc(e.name)}</h3><p style="color:#6ca7ff;font-weight:800">${esc(e.designation)}</p><p style="margin-top:8px">Experience: ${esc(e.experience)}</p><p style="margin-top:8px">${esc(e.phone)}</p></div>`).join(''):'<div class="hint">Team profiles will appear here after you add employees from Admin.</div>';document.getElementBy function openExternal(url){const w=window.open(url,'_blank','noopener,noreferrer');if(w){w.opener=null;return false}location.href=url;return false}
function normalizeCustomerPhone(v){const d=String(v||'').replace(/\D/g,'');if(d.length===12&&d.startsWith('91'))return d.slice(2);if(d.length===11&&d.startsWith('0'))return d.slice(1);return d}
function validCustomerPhone(v){return /^[6-9]\d{9}$/.test(normalizeCustomerPhone(v))}
function sendWhatsApp(){const s=data.site,n=val('qName'),p=val('qPhone'),pn=normalizeCustomerPhone(p);if(!n)return toast('Name is required');if(!validCustomerPhone(p))return toast('Enter a valid Indian mobile number');const b=`Name: ${n}\nPhone: +91${pn}\nSport/Event: ${val('qEvent')}\nDate: ${val('qDate')}\nVenue: ${val('qVenue')}\nRequirements: ${val('qNeed')}`,num=String(s.whatsapp||s.phone||'').replace(/\D/g,'');if(!num)return toast('Set WhatsApp in Admin');location.href=`https://wa.me/${num}?text=${encodeURIComponent(b)}`}
function sendEmail(){const s=data.site,n=val('qName'),p=val('qPhone'),pn=normalizeCustomerPhone(p);if(!n)return toast('Name is required');if(!validCustomerPhone(p))return toast('Enter a valid Indian mobile number');if(!s.email)return toast('Set enquiry email in Admin');const b=`Name: ${n}\nPhone: +91${pn}\nSport/Event: ${val('qEvent')}\nDate: ${val('qDate')}\nVenue: ${val('qVenue')}\nRequirements: ${val('qNeed')}`;location.href=`mailto:${encodeURIComponent(s.email)}?subject=${encodeURIComponent('Sports Broadcast Enquiry')}&body=${encodeURIComponent(b)}`}
document.addEventListener('click',e=>{if(e.target.id==='adminModal')closeAdmin()});loadPublic().catch(e=>{console.error(e);toast('Website data could not load')});
</script></body></html>
